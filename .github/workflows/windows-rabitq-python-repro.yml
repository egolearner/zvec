name: Windows RaBitQ Python Reproduction

on:
  push:
    branches:
      - debug/windows-rabitq-python-780
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Install build and test dependencies
        shell: pwsh
        run: python -m pip install pybind11==3.0 cmake==3.30.0 ninja==1.11.1 pytest pytest-xdist scikit-build-core setuptools_scm

      - name: Build and install Python package
        shell: pwsh
        run: |
          $env:CMAKE_GENERATOR = 'Ninja'
          $env:CMAKE_BUILD_PARALLEL_LEVEL = '4'
          python -m pip install -v . --no-build-isolation --config-settings='cmake.define.ENABLE_WERROR=ON'

      - name: Run failing RaBitQ tests
        shell: pwsh
        run: |
          python -m pytest -n 0 `
            'python/tests/test_collection_hnsw_rabitq.py::TestHnswRabitqCollectionOptimizeAndReopen::test_optimize_close_reopen_and_query' `
            'python/tests/test_collection_ivf_rabitq.py::TestIvfRabitqCollection::test_optimize_reopen_and_query' `
            'python/tests/test_collection_ivf_rabitq.py::TestIvfRabitqCollection::test_group_by_after_optimize' `
            'python/tests/test_refine_query_params.py::test_query_refine_scale_controls_candidates[hnsw_rabitq]'
