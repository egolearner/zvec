name: Windows C++ Failure Reproduction

on:
  push:
    branches:
      - debug/windows-rabitq-repro-780
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Install build tools
        shell: pwsh
        run: python -m pip install cmake==3.30.0 ninja==1.11.1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TOOLS=OFF -DENABLE_WERROR=ON

      - name: Build focused tests
        shell: pwsh
        run: cmake --build build --target collection_test segment_helper_test --parallel 4

      - name: Run focused tests
        shell: pwsh
        run: ctest --test-dir build -R '^(collection_test|segment_helper_test)$' --output-on-failure
